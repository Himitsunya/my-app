name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev gzip tar curl git ccache zip unzip liblldb-dev libjpeg-dev zlib1g-dev libpng-dev
        pip install --upgrade pip setuptools buildozer cython

    - name: Build with Buildozer
      run: |
        # 1. Лицензии и симлинк для sdkmanager
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        mkdir -p $ANDROID_HOME/tools/bin
        ln -s $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager

        # 2. Инициализация spec-файла
        buildozer init

        # 3. Точечное переписывание конфигурации
        sed -i 's/^requirements =.*/requirements = python3,kivy,kivymd/g' buildozer.spec
        sed -i 's/.*android.accept_sdk_license =.*/android.accept_sdk_license = True/g' buildozer.spec
        sed -i 's/.*android.sdk_path =.*/android.sdk_path = \/usr\/local\/lib\/android\/sdk/g' buildozer.spec
        
        # Принудительно задаем NDK 25b (удаляем старую строку и добавляем новую)
        sed -i '/android.ndk =/d' buildozer.spec
        echo "android.ndk = 25b" >> buildozer.spec

        # Принудительно задаем архитектуру arm64-v8a
        sed -i '/android.archs =/d' buildozer.spec
        echo "android.archs = arm64-v8a" >> buildozer.spec

        # 4. Компиляция
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
        
