name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev gzip tar curl git ccache zip unzip liblldb-dev libjpeg-dev zlib1g-dev libpng-dev
        pip install --upgrade pip setuptools buildozer cython

    - name: Build with Buildozer
      run: |
        # 1. Принятие лицензий системного SDK
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

        # 2. Подготовка локального SDK для Buildozer (создаем структуру, симлинки и лицензии)
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        
        # Связываем sdkmanager с местом, где его ищет Buildozer
        ln -s $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        cp -r $ANDROID_HOME/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ || true

        # 3. Чистая генерация buildozer.spec с верными ключами параметров
        cat << 'EOF' > buildozer.spec
        [app]
        title = My App
        package.name = myapp
        package.domain = org.test
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,json
        version = 0.1
        requirements = python3,kivy,kivymd

        orientation = portrait
        fullscreen = 0

        [buildozer]
        log_level = 2
        warn_on_root = 1

        # Настройки Android (указываем ndk_version для корректной фиксации NDK)
        android.accept_sdk_license = True
        android.ndk_version = 25b
        android.api = 33
        android.minapi = 24
        android.archs = arm64-v8a
        EOF

        # 4. Запуск компиляции
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
        
