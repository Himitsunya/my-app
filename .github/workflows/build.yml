name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - uses: actions/checkout@v4

    - name: Build APK with Buildozer
      env:
        BUILDOZER_ALLOW_KIVY_USER_ROOT: 1
      run: |
        # 1. Автоматический запуск генерации готовых лицензий в целевую папку buildozer
        mkdir -p /github/home/.buildozer/android/platform/android-sdk/licenses
        
        # Автоматическое принятие лицензий
        yes | /home/user/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/github/home/.buildozer/android/platform/android-sdk --licenses || true
        yes | sdkmanager --licenses || true

        # 2. Чистая конфигурация buildozer.spec
        cat << 'EOF' > buildozer.spec
        [app]
        title = My App
        package.name = myapp
        package.domain = org.test
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,json
        version = 0.1
        requirements = python3,kivy,kivymd

        orientation = portrait
        fullscreen = 0

        [buildozer]
        log_level = 2
        warn_on_root = 0

        # Жесткая фиксация параметров Android
        android.accept_sdk_license = True
        android.ndk_version = 25b
        android.api = 33
        android.minapi = 24
        android.archs = arm64-v8a
        EOF

        # 3. Запуск сборки
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
        
